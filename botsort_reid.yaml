# Ultralytics BoT-SORT tuned for a fixed traffic camera with short occlusions.
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 90
match_thresh: 0.85
fuse_score: True

# The camera is fixed, so global-motion compensation only adds overhead.
gmc_method: none

# Reconnect vehicles by appearance after they pass behind another vehicle.
proximity_thresh: 0.5
appearance_thresh: 0.85
with_reid: True
model: auto
